<html lang="en">

    <meta charset="UTF-8" />

    <title>FlowDesk — Treasury Spending Workflows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- Anti-flash: apply theme BEFORE first paint -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('flowdesk-theme');
          var preferred = stored
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (preferred === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Built with Arc Studio — https://studio.arc.io -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
